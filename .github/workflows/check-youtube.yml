name: Marvel YouTube Checker

on:
  schedule:
    # Har 30 daqiqada bir marta ishga tushadi
    - cron: "*/30 * * * *"
  workflow_dispatch: # Qo'lda ham ishga tushirish mumkin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Skriptni ishga tushirish
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node index.js

      - name: Holatni saqlash (last-seen.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last-seen.json
          git diff --staged --quiet || git commit -m "Holatni yangilash: yangi video aniqlandi"
          git push
